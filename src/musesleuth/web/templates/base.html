<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MuseSleuth{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex items-center gap-8">
        <a href="/" class="text-lg font-bold text-indigo-400 tracking-wide">MuseSleuth</a>
        {% set path = request.url.path %}
        <a href="/tracks" class="text-sm transition {{ 'text-white font-medium' if path == '/' or path.startswith('/tracks') else 'text-gray-400 hover:text-white' }}">Tracks</a>
        <a href="/playlists" class="text-sm transition {{ 'text-white font-medium' if path.startswith('/playlists') else 'text-gray-400 hover:text-white' }}">Playlists</a>
        <a href="/status" class="text-sm transition {{ 'text-white font-medium' if path.startswith('/status') else 'text-gray-400 hover:text-white' }}">Pipeline</a>
    </nav>
    <main class="flex-1 px-6 py-6 max-w-[1400px] mx-auto w-full">
        {% block content %}{% endblock %}
    </main>
    <footer class="text-center text-xs text-gray-600 py-4 border-t border-gray-800">
        MuseSleuth Web Explorer
    </footer>
    <script>
        let currentAudio = null;
        function playTrack(metadataId, btn) {
            if (currentAudio) {
                currentAudio.pause();
                document.querySelectorAll('.play-btn').forEach(b => b.textContent = 'Play');
            }
            if (currentAudio && currentAudio.dataset.mid === metadataId) {
                currentAudio = null;
                return;
            }
            const audio = new Audio('/audio/' + metadataId);
            audio.dataset.mid = metadataId;
            audio.play();
            btn.textContent = 'Stop';
            currentAudio = audio;
            audio.addEventListener('ended', () => {
                btn.textContent = 'Play';
                currentAudio = null;
            });
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
